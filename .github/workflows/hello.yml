name: .NET Backend CI

on:
  push:
    branches:
      - joska
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Get code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # 3. Restore dependencies
      - name: Restore dependencies
        run: dotnet restore brokerApp.API

      # 4. Build project
      - name: Build project
        run: dotnet build brokerApp.API --no-restore

      # 5. Run tests (if any exist)
      - name: Run tests
        run: dotnet test brokerApp.API --no-build || true

      # 6. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t brokerapp-api:latest -f brokerApp.API/Dockerfile .

      # 7. Authenticate gcp
      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/894445865298/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@project-d4757723-0bc3-412e-b9f.iam.gserviceaccount.com
