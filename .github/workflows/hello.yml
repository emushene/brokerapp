name: .NET Backend CI

on:
  push:
    branches:
      - joska
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # 3. Restore
      - name: Restore dependencies
        run: dotnet restore brokerApp.API

      # 4. Build
      - name: Build project
        run: dotnet build brokerApp.API --no-restore

      # 5. Docker build
      - name: Build Docker image
        run: docker build -t brokerapp-api:latest -f brokerApp.API/Dockerfile .

      # 6. Authenticate to GCP (WIF)
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/894445865298/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@project-d4757723-0bc3-412e-b9f.iam.gserviceaccount.com

      # 7. Setup GCP SDK  👈 THIS IS STEP 2 YOU ASKED ABOUT
      - name: Setup GCP SDK
        uses: google-github-actions/setup-gcloud@v2

      # 8. Configure Docker for Artifact Registry
      - name: Configure Docker
        run: gcloud auth configure-docker africa-south1-docker.pkg.dev --quiet

      # 9. Tag image
      - name: Tag image
        run: |
          docker tag brokerapp-api:latest \
          africa-south1-docker.pkg.dev/project-d4757723-0bc3-412e-b9f/sre-repo/brokerapp-api:latest

      # 10. Push image
      - name: Push image
        run: |
          docker push africa-south1-docker.pkg.dev/project-d4757723-0bc3-412e-b9f/sre-repo/brokerapp-api:latest
