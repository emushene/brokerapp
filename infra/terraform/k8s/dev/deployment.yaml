apiVersion: apps/v1
kind: Deployment
metadata:
  name: brokerapp-api
  namespace: dev
  labels:
    app: brokerapp-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: brokerapp-api
  template:
    metadata:
      labels:
        app: brokerapp-api
    spec:
      containers:
        - name: brokerapp-api
          image: africa-south1-docker.pkg.dev/PROJECT_ID/sre-repo/brokerapp-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.dev.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "brokerapp-api"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: brokerapp-api
  namespace: dev
  labels:
    app: brokerapp-api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8080"
spec:
  selector:
    app: brokerapp-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP
